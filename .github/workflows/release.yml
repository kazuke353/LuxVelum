name: Windows release build

on:
  push:
    branches: [main, reforged-dev, reforged-main, deus]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh:
        description: On reforged-main, rebuild the release of the current VERSION instead of refusing to
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and check Win32 Release
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check source comments
        run: python tools/check_comments.py

      - name: Configure Win32
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A Win32

      - name: Build DLLs, shaders and harness
        run: cmake --build build --config Release --parallel

      - name: Run checks that do not require a graphics device
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error -LE gpu

      - name: Assemble install files
        run: |
          $package = 'build/package'
          New-Item -ItemType Directory -Path $package | Out-Null
          $files = 'Luxvelum.dll', 'WTF/Luxvelum.ini', 'Data/Luxvelum/fogdata.bin',
            'Data/Luxvelum/fogdata-without-darker-nights.bin', 'Data/Luxvelum/waterdata.bin', 'Data/Luxvelum/zones.ini'
          foreach ($file in $files) {
            $destination = "$package/$file"
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
            Copy-Item -LiteralPath "build/Release/$file" -Destination $destination -ErrorAction Stop
          }
          Copy-Item -LiteralPath README.md, LICENSE -Destination $package -ErrorAction Stop
          Copy-Item -LiteralPath build/_deps/imgui-src/LICENSE.txt -Destination "$package/Dear-ImGui-LICENSE.txt"
          @(
            "Version: $((Get-Content -LiteralPath VERSION -TotalCount 1).Trim())"
            "Commit: $env:GITHUB_SHA"
            "Build: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            'Configuration: Win32 Release'
            'Validation: build, source comments and CPU harness passed.'
            'D3D9 graphics checks and in-game validation were not run.'
          ) | Set-Content -Path "$package/BUILD.txt" -Encoding utf8
          $loader = 'build/loader-package'
          New-Item -ItemType Directory -Path $loader | Out-Null
          Copy-Item -LiteralPath build/Release/version.dll, LICENSE -Destination $loader -ErrorAction Stop

      - name: Upload install archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Luxvelum-Win32-${{ github.sha }}
          path: build/package/
          if-no-files-found: error
          retention-days: 30

      - name: Upload the optional version.dll loader
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Luxvelum-version-dll-Win32-${{ github.sha }}
          path: build/loader-package/
          if-no-files-found: error
          retention-days: 30

      - name: Upload test diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/Testing/Temporary/
            build/cpu-harness-out/harness.log
            build/Release/Logs/Luxvelum.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish the install archive as a release
    needs: build
    if: >-
      github.ref == 'refs/heads/reforged-main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download install files
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: Luxvelum-Win32-${{ github.sha }}
          path: package

      - name: Download the optional version.dll loader
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: Luxvelum-version-dll-Win32-${{ github.sha }}
          path: loader

      - name: Zip install files
        run: |
          (cd package && zip -r ../Luxvelum-Win32.zip .)
          (cd loader && zip -r ../Luxvelum-version-dll-Win32.zip .)
          cp package/WTF/Luxvelum.ini Luxvelum.ini

      - name: Check out the version and the release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: source
          sparse-checkout: |
            VERSION
            RELEASE_NOTES.md
          sparse-checkout-cone-mode: false

      - name: Create or refresh the release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REFRESH: ${{ inputs.refresh }}
        run: |
          short="${SHA:0:7}"
          head=$(gh api "repos/${GITHUB_REPOSITORY}/branches/${BRANCH}" --jq .commit.sha)
          if [ "$head" != "$SHA" ]; then
            echo "::notice::${BRANCH} has moved on to ${head:0:7}; the superseded build ${short} gets no release"
            exit 0
          fi
          version=$(tr -d '\r\n ' < source/VERSION)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must hold MAJOR.MINOR.PATCH, not '${version}'"
            exit 1
          fi
          tag="v${version}"
          {
            if [ -s source/RELEASE_NOTES.md ]; then
              cat source/RELEASE_NOTES.md
              echo
              echo "## Install"
              echo
            fi
            echo "Luxvelum: Atmospheric Immersion for Project Reforged — WoW 3.3.5."
            echo
            echo "Win32 Release build of \`${BRANCH}\` at ${short}."
            echo
            echo "Patch \`Wow.exe\` once with the Luxvelum loader of St0ny's AIO WoW EXE Patcher (see"
            echo "[Install](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${SHA}/README.md#install) in \`README.md\`),"
            echo "or use the optional \`version.dll\` loader below instead: without one of them \`Luxvelum.dll\` is"
            echo "never loaded and no \`Luxvelum.log\` is written."
            echo
            echo "Then, with the client closed, unzip \`Luxvelum-Win32.zip\` into the client folder next to"
            echo "\`Wow.exe\`: it puts \`Luxvelum.dll\` next to \`Wow.exe\`, \`fogdata.bin\` and"
            echo "\`fogdata-without-darker-nights.bin\` (Luxvelum loads the one that matches the client's night"
            echo "lighting, with or without the Project Reforged darker nights patch), \`waterdata.bin\` and"
            echo "\`zones.ini\` (the shipped sun and moon halo per zone) into \`Data\\Luxvelum\`, and"
            echo "\`Luxvelum.ini\` (the default settings) into \`WTF\`. Your own halos in"
            echo "\`WTF\\Luxvelum-zones.ini\` are not in the package and stay as they are. The log is"
            echo "written to \`Logs\\Luxvelum.log\`. Delete the \`version.dll\` of a CoAVolFog or Luxveil package,"
            echo "or the client does not start."
            echo "To keep your settings, leave out \`WTF\\Luxvelum.ini\`: an existing \`Luxvelum.ini\` next to"
            echo "\`Wow.exe\`, else \`Luxveil.ini\` or \`CoAVolFog.ini\`, is then taken over into \`WTF\` on the"
            echo "next start. The \`Luxvelum.ini\`, \`Luxvelum.log\`, \`fogdata.bin\` and \`waterdata.bin\` of an"
            echo "earlier package next to \`Wow.exe\`, and the old \`Luxveil.*\` and \`CoAVolFog.*\` files, are then"
            echo "no longer used and can be deleted; delete the earlier INI once \`Logs\\Luxvelum.log\` names it as"
            echo "taken over, or a later reset of \`WTF\` takes it over again."
            echo "\`BUILD.txt\` names the commit. \`Luxvelum.ini\`, attached on its own, is the same file as"
            echo "\`WTF/Luxvelum.ini\` in the zip, for the Project Reforged Launcher."
            echo
            echo "Optional: \`Luxvelum-version-dll-Win32.zip\` holds \`version.dll\`, a loader for a \`Wow.exe\`"
            echo "without the Luxvelum loader patch. Unzip it next to \`Wow.exe\`; it forwards everything to the"
            echo "system's \`version.dll\` and loads \`Luxvelum.dll\` before the client starts. On Linux with Proton"
            echo "or Wine, also set the launch option \`WINEDLLOVERRIDES=version=n,b %command%\`. A patched"
            echo "\`Wow.exe\` does not need it. Remove \`version.dll\` together with \`Luxvelum.dll\` to uninstall:"
            echo "left on its own, it keeps the client from starting."
            echo
            echo "Validation: build, source comments and CPU harness passed in [run ${RUN_NUMBER}](${RUN_URL})."
            echo "D3D9 graphics checks and in-game validation were not run."
          } > notes.md
          release_title() {
            echo "Luxvelum v${version} (${BRANCH} ${short})"
          }
          create_release() {
            gh release create "$tag" Luxvelum-Win32.zip Luxvelum-version-dll-Win32.zip Luxvelum.ini \
              --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "$(release_title)" --notes-file notes.md
          }
          move_tag() {
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" -f sha="$SHA" -F force=true --silent
          }
          tagged_commit() {
            gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha 2> /dev/null
          }
          asset_id() {
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq ".assets[] | select(.name == \"$1\") | .id"
          }
          rename_asset() {
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/assets/$1" -f name="$2" --silent
          }
          delete_asset() {
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/$1" --silent
          }
          upload_replacement_zip() {
            cp Luxvelum-Win32.zip Luxvelum-Win32.new.zip
            gh release upload "$tag" Luxvelum-Win32.new.zip --clobber --repo "$GITHUB_REPOSITORY"
          }
          discard_replacement_zip() {
            local replacement
            replacement=$(asset_id Luxvelum-Win32.new.zip) && delete_asset "$replacement"
          }
          swap_in_replacement_zip() {
            local stale live replacement
            stale=$(asset_id Luxvelum-Win32.old.zip)
            if [ -n "$stale" ]; then
              delete_asset "$stale"
            fi
            live=$(asset_id Luxvelum-Win32.zip)
            replacement=$(asset_id Luxvelum-Win32.new.zip)
            if [ -n "$live" ]; then
              rename_asset "$live" Luxvelum-Win32.old.zip
            fi
            if ! rename_asset "$replacement" Luxvelum-Win32.zip; then
              echo "::error::the new zip of ${tag} could not be renamed to Luxvelum-Win32.zip"
              if [ -n "$live" ]; then
                rename_asset "$live" Luxvelum-Win32.zip
              fi
              exit 1
            fi
            if [ -n "$live" ]; then
              delete_asset "$live" || echo "::warning::the replaced zip of ${tag} stays as Luxvelum-Win32.old.zip"
            fi
          }
          refresh_release() {
            upload_replacement_zip
            if ! move_tag; then
              discard_replacement_zip || echo "::warning::Luxvelum-Win32.new.zip stays on ${tag} until it is deleted"
              echo "::error::the tag ${tag} could not be moved to ${short}"
              exit 1
            fi
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "$(release_title)" \
              --notes-file notes.md
            swap_in_replacement_zip
            gh release upload "$tag" Luxvelum-version-dll-Win32.zip Luxvelum.ini --clobber --repo "$GITHUB_REPOSITORY"
          }
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            if [ "$REFRESH" = "true" ]; then
              refresh_release
            elif [ "$(tagged_commit)" != "$SHA" ]; then
              echo "::error::${tag} is released already from another commit; raise VERSION, or rerun with refresh"
              exit 1
            else
              gh release upload "$tag" Luxvelum-Win32.zip Luxvelum-version-dll-Win32.zip Luxvelum.ini --clobber \
                --repo "$GITHUB_REPOSITORY"
            fi
          else
            create_release
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Delete every older release
        if: ${{ steps.publish.outputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.publish.outputs.tag }}
        run: |
          if ! older=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name'); then
            echo "::warning::the releases could not be listed, so the older ones stay"
            exit 0
          fi
          for old in $older; do
            [ "$old" = "$TAG" ] && continue
            gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes ||
              echo "::warning::the older release ${old} could not be deleted"
          done

  test-release:
    name: Publish or remove the test release of reforged-dev
    needs: build
    if: >-
      github.ref == 'refs/heads/reforged-dev' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download install files
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: Luxvelum-Win32-${{ github.sha }}
          path: package

      - name: Download the optional version.dll loader
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: Luxvelum-version-dll-Win32-${{ github.sha }}
          path: loader

      - name: Zip install files
        run: |
          (cd package && zip -r ../Luxvelum-Win32.zip .)
          (cd loader && zip -r ../Luxvelum-version-dll-Win32.zip .)
          cp package/WTF/Luxvelum.ini Luxvelum.ini

      - name: Check out the version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: source
          sparse-checkout: VERSION
          sparse-checkout-cone-mode: false

      - name: Replace the test release
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          MAIN: reforged-main
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          short="${SHA:0:7}"
          head=$(gh api "repos/${GITHUB_REPOSITORY}/branches/${BRANCH}" --jq .commit.sha)
          if [ "$head" != "$SHA" ]; then
            echo "::notice::${BRANCH} has moved on to ${head:0:7}; the superseded build ${short} gets no test release"
            exit 0
          fi
          releases=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | "\(.tag_name) \(.prerelease) \(.published_at)"')
          tests=$(echo "$releases" | awk '$1 ~ /^build-[0-9]+(-[0-9]+)?-test$/ || $1 ~ /^v[0-9.]+-test\.[0-9]+$/ {
            print $1 }')
          for old in $tests; do
            gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes ||
              echo "::warning::the old test release ${old} could not be deleted"
          done
          ahead=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${MAIN}...${SHA}" --jq .ahead_by)
          if [ "$ahead" = "0" ]; then
            echo "::notice::${MAIN} already contains ${short}; no test release"
            exit 0
          fi
          version=$(tr -d '\r\n ' < source/VERSION)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must hold MAJOR.MINOR.PATCH, not '${version}'"
            exit 1
          fi
          newest=$(echo "$releases" | awk '$2 == "false" { print $3 }' | sort | tail -n 1)
          workflow=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .workflow_id)
          runs="repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=${BRANCH}&status=success"
          if [ -n "$newest" ]; then
            runs="${runs}&created=%3E${newest}"
          fi
          earlier=$(gh api "${runs}&per_page=1" --jq .total_count)
          attempt=$(( earlier + 1 ))
          replaced=$(echo "$tests" | awk -v v="v${version}-test." 'index($1, v) == 1 {
            print substr($1, length(v) + 1) }' | sort -n | tail -n 1)
          if [ -n "$replaced" ] && [ "$replaced" -ge "$attempt" ]; then
            attempt=$(( replaced + 1 ))
          fi
          tag="v${version}-test.${attempt}"
          title="Luxvelum TEST v${version}-test.${attempt} (${BRANCH} ${short})"
          {
            echo "Luxvelum: Atmospheric Immersion for Project Reforged — WoW 3.3.5."
            echo
            echo "**Test build, not a release.** It is test build ${attempt} of version ${version}:"
            echo "\`${BRANCH}\` at ${short}, ${ahead} commit(s) ahead of \`${MAIN}\`. Use it only to test the next"
            echo "version; the current release stays at releases/latest."
            echo
            echo "Patch \`Wow.exe\` once with the Luxvelum loader of St0ny's AIO WoW EXE Patcher (see"
            echo "[Install](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${SHA}/README.md#install) in \`README.md\`),"
            echo "or use the optional \`version.dll\` loader below instead: without one of them \`Luxvelum.dll\` is"
            echo "never loaded and no \`Luxvelum.log\` is written."
            echo
            echo "Then, with the client closed, unzip \`Luxvelum-Win32.zip\` into the client folder next to"
            echo "\`Wow.exe\`: it puts \`Luxvelum.dll\` next to \`Wow.exe\`, \`fogdata.bin\` and"
            echo "\`fogdata-without-darker-nights.bin\` (Luxvelum loads the one that matches the client's night"
            echo "lighting, with or without the Project Reforged darker nights patch), \`waterdata.bin\` and"
            echo "\`zones.ini\` (the shipped sun and moon halo per zone) into \`Data\\Luxvelum\`, and"
            echo "\`Luxvelum.ini\` (the default settings) into \`WTF\`. Your own halos in"
            echo "\`WTF\\Luxvelum-zones.ini\` are not in the package and stay as they are. The log is"
            echo "written to \`Logs\\Luxvelum.log\`. Delete the \`version.dll\` of a CoAVolFog or Luxveil package,"
            echo "or the client does not start."
            echo "To keep your settings, leave out \`WTF\\Luxvelum.ini\`: an existing \`Luxvelum.ini\` next to"
            echo "\`Wow.exe\`, else \`Luxveil.ini\` or \`CoAVolFog.ini\`, is then taken over into \`WTF\` on the"
            echo "next start. The \`Luxvelum.ini\`, \`Luxvelum.log\`, \`fogdata.bin\` and \`waterdata.bin\` of an"
            echo "earlier package next to \`Wow.exe\`, and the old \`Luxveil.*\` and \`CoAVolFog.*\` files, are then"
            echo "no longer used and can be deleted; delete the earlier INI once \`Logs\\Luxvelum.log\` names it as"
            echo "taken over, or a later reset of \`WTF\` takes it over again."
            echo "\`BUILD.txt\` names the commit. \`Luxvelum.ini\`, attached on its own, is the same file as"
            echo "\`WTF/Luxvelum.ini\` in the zip, for the Project Reforged Launcher."
            echo
            echo "Optional: \`Luxvelum-version-dll-Win32.zip\` holds \`version.dll\`, a loader for a \`Wow.exe\`"
            echo "without the Luxvelum loader patch. Unzip it next to \`Wow.exe\`; it forwards everything to the"
            echo "system's \`version.dll\` and loads \`Luxvelum.dll\` before the client starts. On Linux with Proton"
            echo "or Wine, also set the launch option \`WINEDLLOVERRIDES=version=n,b %command%\`. A patched"
            echo "\`Wow.exe\` does not need it. Remove \`version.dll\` together with \`Luxvelum.dll\` to uninstall:"
            echo "left on its own, it keeps the client from starting."
            echo
            echo "Validation: build, source comments and CPU harness passed in [run ${RUN_NUMBER}](${RUN_URL})."
            echo "D3D9 graphics checks and in-game validation were not run."
          } > notes.md
          gh release create "$tag" Luxvelum-Win32.zip Luxvelum-version-dll-Win32.zip Luxvelum.ini \
            --repo "$GITHUB_REPOSITORY" --prerelease --latest=false --target "$SHA" --title "$title" \
            --notes-file notes.md
          behind=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${MAIN}...${SHA}" --jq .ahead_by)
          if [ "$behind" = "0" ]; then
            echo "::notice::${MAIN} took ${short} meanwhile; the test release ${tag} is deleted again"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes ||
              echo "::warning::the test release ${tag} could not be deleted"
          fi
